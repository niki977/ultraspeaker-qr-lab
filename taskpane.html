<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>The Ultraspeaker QR Lab</title>
<!-- Pagina del pannello indicata nel manifest: rimanda a index.html conservando i parametri.
     Il segno in sessionStorage dice a index.html che è aperta nel pannello di PowerPoint. -->
<script>
  try { sessionStorage.setItem("ultraspeaker.qr.panel", "1"); } catch (e) { /* memoria non disponibile */ }
  location.replace("index.html" + location.search + location.hash);
</script>
</head>
<body style="background:#000"></body>
</html>
