<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultraspeaker Image Lab</title>
<meta name="description" content="Adjust the photos on your slides like in a photo editor: histogram, levels, light and colour, crop, rotation and DuoTone. The original always stays in the presentation.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-title" content="Image Lab">
<meta name="application-name" content="Image Lab">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20261112">
<link rel="icon" type="image/png" sizes="32x32" href="assets/image-lab-icon-32.png?v=20261112">
<link rel="apple-touch-icon" href="assets/image-lab-icon-180.png?v=20261112">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="shared/ultraspeaker-lab.css?v=20261112">
<link rel="stylesheet" href="css/app.css?v=20261112">
<!-- Office.js: in PowerPoint collega il pannello alla presentazione; se non si carica, parte la versione web -->
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="shared/ultraspeaker-lang.js?v=20261112"></script>
</head>
<body>
<div class="app us-page us-page--narrow">
  <header class="us-header">
    <div>
      <a class="us-logo ext" href="https://www.theultraspeaker.com" target="_blank" rel="noopener"><img src="assets/logo-image-lab-white.svg?v=20261112" alt="The Ultraspeaker Image Lab" width="167" height="60"></a>
      <p class="us-subtitle" id="status"><i class="us-dot"></i><span id="statusText"></span></p>
    </div>
    <div class="us-header-tools">
      <label class="us-lang">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="us-sr" data-i18n="lang"></span><select id="lang"></select>
      </label>
      <!-- Su telefono e nel pannello si vede solo l'icona: il nome resta in aria-label -->
      <a class="us-btn us-guide" id="usGuide" href="guide/image-lab-guide-en.pdf" target="_blank" rel="noopener" data-i18n-aria="us.guide.title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg><span data-i18n="us.guide"></span></a>
    </div>
  </header>

  <!-- Nessuna immagine / versione non supportata / caricamento -->
  <section class="empty us-spotlight" id="empty">
    <img src="assets/image-lab-logetto.svg" alt="">
    <h2 id="emptyTitle"></h2>
    <p id="emptyText"></p>
  </section>
  <section class="empty us-spotlight" id="loading" hidden>
    <div class="spinner" aria-hidden="true"></div>
    <p data-i18n="status.loading"></p>
  </section>

  <!-- Editor -->
  <main class="scroll" id="editor" hidden>
    <div class="pin">
      <div class="pvrow">
        <div class="preview" id="preview">
          <canvas id="pv" data-i18n-aria="preview" role="img"></canvas>
          <div class="badge-orig" data-i18n="original"></div>
          <div class="rotgrid" id="rotGrid" hidden></div>
          <div class="cropbox" id="cropBox" hidden>
            <span class="ch nw" data-h="nw"></span><span class="ch ne" data-h="ne"></span><span class="ch sw" data-h="sw"></span><span class="ch se" data-h="se"></span>
          </div>
        </div>
        <div class="zoombar" id="zoombar" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-i18n-aria="zoom">
          <div class="ztrack"><div class="zfill" id="zfill"></div><div class="zthumb" id="zthumb"></div></div>
        </div>
      </div>
      <div class="tools">
        <button type="button" class="us-btn us-btn--icon" id="undoBtn" data-i18n-aria="undo" data-i18n-title="undo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
        <button type="button" class="us-btn us-btn--icon" id="redoBtn" data-i18n-aria="redo" data-i18n-title="redo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
        <button type="button" class="us-btn" id="cropBtn" aria-pressed="false" data-i18n-title="crop"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg><span data-i18n="crop"></span></button>
        <button type="button" class="us-btn" id="rotBtn" aria-pressed="false" aria-controls="rotPanel" data-i18n-title="rotate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg><span data-i18n="rotate"></span></button>
        <button type="button" class="us-btn us-btn--icon" id="duoBtn" aria-pressed="false" aria-controls="duoPanel" data-i18n-title="duo.tool" data-i18n-aria="duo.tool"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/></svg></button>
        <span class="zhint" id="zoomHint"></span>
        <button type="button" class="us-btn zoom-lbl" id="zoomLbl" data-i18n-title="fitTitle"></button>
      </div>
    </div>

    <section class="us-panel tool-panel" id="duoPanel" hidden>
      <div class="duohead">
        <div class="us-label" id="duoTitle"></div>
        <button type="button" class="us-chip" id="duoOn" aria-pressed="false"></button>
      </div>
      <div class="us-tabs" role="tablist" data-i18n-aria="duo">
        <button type="button" class="us-tab" role="tab" id="duoM2" aria-selected="true">DuoTone</button>
        <button type="button" class="us-tab" role="tab" id="duoM3" aria-selected="false">TriTone</button>
      </div>
      <div class="dpre" id="duoPresets"></div>
      <div class="dcols">
        <div class="dcol" id="dRowS">
          <div class="dlab"><span data-i18n="duo.shadows"></span><label class="tchk"><input type="checkbox" id="dTrS"><span data-i18n="duo.transparent"></span></label></div>
          <div class="dctl">
            <input type="color" class="cpick" id="dcS" data-i18n-aria="duo.shadows">
            <input type="text" class="us-field hex" id="dhS" maxlength="7" spellcheck="false" autocomplete="off" data-i18n-aria="duo.shadows">
            <button type="button" class="us-btn us-btn--icon" id="dpS" data-i18n-aria="duo.pick" data-i18n-title="duo.pick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6M17 7l-9.5 9.5L4 20l3.5-3.5L17 7z"/></svg></button>
          </div>
        </div>
        <div class="dcol" id="dRowM">
          <div class="dlab"><span data-i18n="duo.mids"></span></div>
          <div class="dctl">
            <input type="color" class="cpick" id="dcM" data-i18n-aria="duo.mids">
            <input type="text" class="us-field hex" id="dhM" maxlength="7" spellcheck="false" autocomplete="off" data-i18n-aria="duo.mids">
            <button type="button" class="us-btn us-btn--icon" id="dpM" data-i18n-aria="duo.pick" data-i18n-title="duo.pick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6M17 7l-9.5 9.5L4 20l3.5-3.5L17 7z"/></svg></button>
          </div>
        </div>
        <div class="dswap"><button type="button" class="us-btn" id="duoSwap"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg><span data-i18n="duo.swap"></span></button></div>
        <div class="dcol" id="dRowH">
          <div class="dlab"><span data-i18n="duo.lights"></span><label class="tchk"><input type="checkbox" id="dTrH"><span data-i18n="duo.transparent"></span></label></div>
          <div class="dctl">
            <input type="color" class="cpick" id="dcH" data-i18n-aria="duo.lights">
            <input type="text" class="us-field hex" id="dhH" maxlength="7" spellcheck="false" autocomplete="off" data-i18n-aria="duo.lights">
            <button type="button" class="us-btn us-btn--icon" id="dpH" data-i18n-aria="duo.pick" data-i18n-title="duo.pick"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6M17 7l-9.5 9.5L4 20l3.5-3.5L17 7z"/></svg></button>
          </div>
        </div>
      </div>
      <div class="srow" id="dMidRow"><label for="dMid" data-i18n="duo.mid"></label><input id="dMid" class="sl" type="range" min="5" max="95" step="1"><output for="dMid" id="dMidOut"></output></div>
      <div class="srow"><label for="dAmt" data-i18n="duo.amount"></label><input id="dAmt" class="sl" type="range" min="0" max="100" step="1"><output for="dAmt" id="dAmtOut"></output></div>
      <div class="us-note" id="duoPickHint" data-i18n="duo.pickHint" hidden></div>
      <p class="note" data-i18n="duo.note"></p>
      <p class="us-note us-note--warn" id="duoTrNote" data-i18n="duo.trNote" hidden></p>
      <div class="row">
        <button type="button" class="us-btn" id="duoRemove" data-i18n="duo.remove"></button>
        <span class="push"></span>
        <button type="button" class="us-btn us-btn--primary" id="duoDone" data-i18n="rot.done"></button>
      </div>
    </section>
    <section class="us-panel tool-panel" id="rotPanel" hidden>
      <div class="us-label" data-i18n="rot.title"></div>
      <div class="chips">
        <button type="button" class="us-chip ic" id="rotL" data-i18n-aria="rot.left" data-i18n-title="rot.left"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.34-5.66"/><path d="M4 4v5h5"/></svg>90°</button>
        <button type="button" class="us-chip ic" id="rotR" data-i18n-aria="rot.right" data-i18n-title="rot.right"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v5h-5"/></svg>90°</button>
        <button type="button" class="us-chip ic" id="rot180" data-i18n-aria="rot.half" data-i18n-title="rot.half"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>180°</button>
      </div>
      <div class="rotrow">
        <label for="rotFine" data-i18n="rot.straighten"></label>
        <input id="rotFine" class="sl bi" type="range" min="-45" max="45" step="0.1" value="0">
        <div class="spin">
          <input id="rotNum" class="us-field" type="number" min="-45" max="45" step="0.1" value="0" inputmode="decimal" data-i18n-aria="rot.straighten">
          <span class="deg">°</span>
          <div class="arrows">
            <button type="button" id="rotUp" data-i18n-aria="rot.up" data-i18n-title="rot.up"><svg viewBox="0 0 12 8" aria-hidden="true"><path d="M2 6.5L6 2.5l4 4"/></svg></button>
            <button type="button" id="rotDown" data-i18n-aria="rot.down" data-i18n-title="rot.down"><svg viewBox="0 0 12 8" aria-hidden="true"><path d="M2 1.5l4 4 4-4"/></svg></button>
          </div>
        </div>
      </div>
      <p class="note" id="rotInfo"></p>
      <p class="note" data-i18n="rot.hint"></p>
      <div class="row">
        <button type="button" class="us-btn" id="rotReset" data-i18n="rot.reset"></button>
        <span class="push"></span>
        <button type="button" class="us-btn us-btn--primary" id="rotDone" data-i18n="rot.done"></button>
      </div>
    </section>
    <section class="us-panel tool-panel" id="cropPanel" hidden>
      <div class="us-label" data-i18n="crop.title"></div>
      <label class="fld"><span data-i18n="crop.format"></span><select id="cropFmt" class="us-field"></select></label>
      <div class="cust" id="cropCustom" hidden>
        <label class="fld"><span data-i18n="crop.width"></span><input id="cW" class="us-field" type="number" min="1" step="any" inputmode="decimal"></label>
        <span class="x">×</span>
        <label class="fld"><span data-i18n="crop.height"></span><input id="cH" class="us-field" type="number" min="1" step="any" inputmode="decimal"></label>
        <label class="fld"><span data-i18n="crop.unit"></span><select id="cU" class="us-field"><option value="px">px</option><option value="cm">cm</option></select></label>
        <label class="fld" id="cDpiWrap" hidden><span data-i18n="crop.dpi"></span><input id="cDpi" class="us-field" type="number" min="72" max="1200" step="1" value="300" inputmode="numeric"></label>
      </div>
      <div class="row">
        <button type="button" class="us-btn" id="cropSwap"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="8" width="11" height="13" rx="1.5"/><path d="M12 3h4a4 4 0 0 1 4 4v4"/><path d="M17 8l3 3 3-3"/></svg><span data-i18n="crop.swap"></span></button>
      </div>
      <p class="note" id="cropInfo"></p>
      <p class="us-note us-note--warn" id="cropWarn" hidden></p>
      <p class="note" data-i18n="crop.hint"></p>
      <div class="row">
        <button type="button" class="us-btn" id="cropRemove" data-i18n="crop.remove"></button>
        <span class="push"></span>
        <button type="button" class="us-btn" id="cropCancel" data-i18n="crop.cancel"></button>
        <button type="button" class="us-btn us-btn--primary" id="cropApply" data-i18n="crop.apply"></button>
      </div>
    </section>
    <div class="row" id="loadRow" hidden>
      <button type="button" class="us-btn" id="loadBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg><span data-i18n="loadPhoto"></span></button>
      <span class="note" data-i18n="orDrop"></span>
      <input type="file" id="fileIn" accept="image/*" hidden>
    </div>

    <section class="stack">
      <div class="hist-head">
        <div class="us-label" data-i18n="histogram"></div>
        <div class="chips" role="group" data-i18n-aria="channel">
          <button class="us-chip" type="button" data-ch="rgb" aria-pressed="true">RGB</button>
          <button class="us-chip" type="button" data-ch="r" aria-pressed="false">R</button>
          <button class="us-chip" type="button" data-ch="g" aria-pressed="false">G</button>
          <button class="us-chip" type="button" data-ch="b" aria-pressed="false">B</button>
          <button class="us-chip" type="button" data-ch="l" aria-pressed="false">LUM</button>
        </div>
      </div>
      <div class="hist">
        <canvas id="hist" data-i18n-aria="histogram" role="img"></canvas>
        <div class="clip lo" id="clipLo" data-i18n="clipLo"></div>
        <div class="clip hi" id="clipHi" data-i18n="clipHi"></div>
      </div>
      <div class="levels">
        <div class="ramp"></div>
        <div class="lvwrap">
          <input class="lv b" id="lvB" type="range" min="0" max="255" step="1" value="0" data-i18n-aria="black">
          <input class="lv w" id="lvW" type="range" min="0" max="255" step="1" value="255" data-i18n-aria="white">
          <input class="lv m" id="lvM" type="range" min="0" max="255" step="1" value="128" data-i18n-aria="mid">
        </div>
        <div class="lvlabels" id="lvLabels">
          <div class="lvl" id="lbB"><b></b><span data-i18n="black"></span></div>
          <div class="lvl" id="lbM"><b></b><span data-i18n="mid"></span></div>
          <div class="lvl" id="lbW"><b></b><span data-i18n="white"></span></div>
        </div>
      </div>
      <div class="row">
        <button type="button" class="us-btn" id="autoLv"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg><span data-i18n="autoLevels"></span></button>
        <button type="button" class="us-btn" id="pickBtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4l6 6M17 7l-9.5 9.5L4 20l3.5-3.5L17 7z"/></svg><span data-i18n="neutral"></span></button>
        <span class="push"></span>
        <button type="button" class="us-btn us-btn--icon" id="resetLv" data-i18n-aria="resetLevels" data-i18n-title="resetLevels"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></svg></button>
      </div>
      <div class="us-note" id="pickHint" data-i18n="pickHint" hidden></div>
    </section>

    <!-- Migliora qualità: pulizia automatica in un clic -->
    <section class="stack">
      <button type="button" class="us-btn us-btn--block" id="qBtn" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg><span data-i18n="quality"></span></button>
      <p class="note" data-i18n="quality.desc"></p>
      <div class="srow" id="qRow" hidden>
        <label for="qAmt" data-i18n="quality.amount"></label>
        <input id="qAmt" class="sl" type="range" min="1" max="100" step="1" value="60">
        <output for="qAmt" id="qOut"></output>
      </div>
    </section>

    <section class="stack">
      <div class="us-label" data-i18n="quick"></div>
      <div class="chips" id="presets"></div>
    </section>

    <div class="sep"></div>
    <section id="sliders"></section>
    <p class="note" id="note"></p>
  </main>

  <!-- Chiusura comune ai Lab: su telefono resta sopra la barra fissa delle azioni -->
  <footer class="us-footer">
    <a class="us-cta" id="usCta" href="mailto:info@theultraspeaker.com"><img src="assets/arena-white.svg?v=20261112" alt=""><span data-i18n="us.cta"></span></a>
    <p class="us-links"><a href="support.html" target="_blank" rel="noopener" data-i18n="us.support"></a><a href="privacy.html" target="_blank" rel="noopener" data-i18n="us.privacy"></a><a href="terms.html" target="_blank" rel="noopener" data-i18n="us.terms"></a><a href="GUIDA-INSTALLAZIONE.html" target="_blank" rel="noopener" data-i18n="us.install"></a></p>
  </footer>

  <div class="foot" id="foot" hidden>
    <button type="button" class="us-btn" id="resetAll" data-i18n="reset"></button>
    <button type="button" class="us-btn" id="beforeBtn" aria-pressed="false" data-i18n="beforeAfter"></button>
    <button type="button" class="us-btn" id="restoreBtn" hidden></button>
    <button type="button" class="us-btn us-btn--primary" id="applyBtn"></button>
  </div>
</div>
<div class="drop" id="drop" hidden><img src="assets/image-lab-logetto.svg" alt=""><span data-i18n="dropHere"></span></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="i18n.js?v=20261112"></script>
<script src="imaging.js?v=20261112"></script>
<script src="app.js?v=20261112"></script>
</body>
</html>
